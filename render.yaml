services:
  - type: web
    name: quasar-backend
    env: go
    plan: free
    region: ohio
    root: apps/api
    buildCommand: go mod tidy && go build -o main
    startCommand: ./main
    envVars:
      - key: GIN_MODE
        value: release
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
